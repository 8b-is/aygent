name: AI Fix Dispatch

on:
  repository_dispatch:
    types: [ai_fix_dispatch]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-fix-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Validate dispatch and create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci/create_fix_request.py
